name: Dependabot go mod tidy

# The chrome module replaces github.com/koizuka/scraper with ../, so a
# Dependabot update to the root go.mod also requires chrome/go.mod and
# chrome/go.sum to be tidied (and vice versa). Dependabot only touches the
# directory it updates, so tidy every module here and push the result.
#
# The push uses a GitHub App installation token instead of GITHUB_TOKEN so
# that the new commit triggers the regular pull_request workflows (Go CI,
# etc.) as PR checks. Required Dependabot secrets (Settings > Secrets and
# variables > Dependabot):
#   TIDY_APP_CLIENT_ID   - Client ID of the GitHub App (Contents: write)
#   TIDY_APP_PRIVATE_KEY - Private key of the GitHub App

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/go.mod'
      - '**/go.sum'

permissions:
  contents: read

jobs:
  tidy:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version: "1.27"

    - name: go mod tidy
      run: |
        go mod tidy
        (cd chrome && go mod tidy)

    - name: Check for changes
      id: diff
      run: |
        if git diff --quiet; then
          echo "No changes"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # Only create the token when there is something to push, so the re-run
    # triggered by our own push (which has no changes) does not need secrets.
    - name: Create GitHub App token
      if: steps.diff.outputs.changed == 'true'
      id: app-token
      uses: actions/create-github-app-token@v3.4.0
      with:
        client-id: ${{ secrets.TIDY_APP_CLIENT_ID }}
        private-key: ${{ secrets.TIDY_APP_PRIVATE_KEY }}
        permission-contents: write

    - name: Commit and push
      if: steps.diff.outputs.changed == 'true'
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "chore: go mod tidy"
        git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
